name: Wiki Lint

on:
  pull_request:
    paths:
      - "wiki/**"
      - "scripts/wiki-lint*.mjs"
      - "AGENTS.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/wiki-lint.yml"
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/wiki-lint*.mjs"
  # 코드가 그대로여도 stale_after는 날짜만 지나면 만료되므로 주기 실행으로 잡음
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09시 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # 위키 검사는 루트의 yaml만 쓰므로 app과 functions 의존성은 설치하지 않음
      - run: pnpm install --frozen-lockfile --filter "{.}"
      - run: pnpm wiki:test
      - run: pnpm wiki:lint
